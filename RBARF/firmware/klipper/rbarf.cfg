# ======================================================================
#  RBARF - Klipper G-code macro suite               wire protocol v2.3
# ======================================================================
#
#  RBARF_SET builds the complete v2.3 wire frame in Jinja and pushes it
#  out as a raw byte stream over a WS2812 chain:
#
#      HEADER(3) || DATA(48) || C16_HI C16_LO x3 || TRAILER(3)
#      FF AA 65                                    9A 00 FF
#
#      = 60 protocol bytes = EXACTLY 20 x 3-byte LEDs.  No pad byte.
#
#  The frame MUST tile the LED chain exactly.  A neopixel chain is
#  configured in 3-byte LEDs, and any surplus wire byte was measured to
#  be FATAL -- every extra byte inflates the receiver's whole-burst
#  clock fit by ~1.6 %/byte and one byte is enough to force a refusal
#  (bench/pad_law.py, ../recon/PROD_CLOSURE.md section 9.4).  That is
#  why the v2.3 marker trim (8 marker bytes -> 6) and the check-block
#  growth (4 bytes -> 6) are ONE change: together they hold the frame at
#  60 bytes.  v2.2 hit the same 60 bytes with 4+4 markers and a 4-byte
#  CRC8 block; v2.3 spends two of those marker bytes on a 16-bit check
#  instead.
#
#  TRAILER[1] is 0x00, not 0x55: a worst-case-ZEROS calibration probe at
#  a KNOWN position, kept in place of the end-of-frame bit-period ruler
#  (owner decision 2026-09-07).  Measured worth +26.7 points of delivery
#  on real silicon (71.1 % -> 97.8 % pooled, paired McNemar 25:1,
#  chi2 20.35, p<0.001, 0 wrong either way); the ruler measured no
#  benefit even under within-capture drift.  Sizing is unchanged.
#
#  CRC16 = CRC-16/CCITT-FALSE (poly 0x1021, init 0xFFFF, no reflection,
#  xorout 0x0000) over the 48 DATA bytes only, written THREE times, high
#  byte first in every copy.  The receiver recovers its reference by
#  INDEPENDENT PER-BYTE majority - reference_HI = majority(H1,H2,H3),
#  reference_LO = majority(L1,L2,L3) - so two copies damaged in
#  DIFFERENT byte positions still yield the exact 16-bit reference.
#  There is NO CRC8 in v2.3.  See ../../docs/PROTOCOL.md and ../bench/crc.py.
#
#  Delivery is SINGLE TRANSMISSION: one RBARF_SET = one frame on the
#  wire.  There are no repeats, retries or acks.  A frame the device
#  misses simply leaves the previous animation running.
#
#  ------------------------------------------------------------------
#  WHY THE CRC IS COMPUTED BIT BY BIT
#  ------------------------------------------------------------------
#  Klipper's Jinja has no bitwise operators at all - no ^, no &, no
#  <<, no >> ("|" is the filter operator).  A table-driven CRC16 needs
#  "(crc >> 8) ^ byte" plus a 256-entry 16-bit table, so it would need
#  a SECOND table just to XOR two bytes.  The bit-serial form below
#  needs no table at all: the only XOR left is a single bit
#  ("(a+b) % 2") and the polynomial fold, which is exact arithmetic
#  because bit 0 is always clear after the shift.  For the CRC8 of v2.2
#  that fold was
#
#      x ^ 0x07   ==  x + 7 - 2 * (x % 8)                when x even
#
#  and 0x1021 has its set bits at 12, 5 and 0, so the same trick reads
#
#      x ^ 0x1021 ==  x + 4129
#                     - 8192 * ((x // 4096) % 2)         bit 12
#                     -   64 * ((x //   32) % 2)         bit 5
#
#  (the bit-0 term vanishes because x is even).  This identity is
#  checked against "x ^ 0x1021" for all 32768 even 16-bit values in
#  verify_macro.py, and mirrors crc16_ccitt_false_bitwise() in
#  ../bench/crc.py - the same table-free reference an on-chip port
#  mirrors.  verify_macro.py proves the macro's CRC equals
#  bench/crc.py's on every test frame.
#
#  ------------------------------------------------------------------
#  JINJA / KLIPPER PORTABILITY RULES OBSERVED IN THIS FILE
#  ------------------------------------------------------------------
#  * Klipper's Jinja delimiters are {% %} for statements and single
#    braces { } for expressions - NOT {{ }}.
#  * No 0x.. integer literals: Jinja2 2.x (Klipper pinned Jinja2
#    2.11.3 for years) does not lex hex literals.  Everything here is
#    decimal.
#  * No {# #} Jinja comments: Klipper reads .cfg with
#    RawConfigParser(inline_comment_prefixes=(';', '#')), which would
#    eat the closing "#}" and leave an unterminated comment.  The ";"
#    lines inside the gcode blocks are stripped by that same parser
#    before Jinja ever sees them, so they are free.
#  * No bitwise operators, no custom filters, nothing outside stock
#    Jinja2 + jinja2.ext.do + Klipper's action_* helpers.
#
#  ------------------------------------------------------------------
#  INSTALL
#  ------------------------------------------------------------------
#  1. copy this file next to printer.cfg
#  2. add   [include rbarf.cfg]   to printer.cfg
#  3. uncomment the [neopixel rbarf] block below and set the pin
#  4. RESTART
#
#  Full parameter reference and examples: README.md in this directory.
# ======================================================================


# ----------------------------------------------------------------------
# [neopixel] - EXAMPLE, uncomment and set your pin
# ----------------------------------------------------------------------
# chain_count MUST be 20 (the 60-byte v2.3 frame is exactly 20 LEDs).
#
# color_order MUST be GRB.  The frame is a raw byte stream, not a
# picture, so what matters is which SET_LED parameter lands on which
# wire byte.  With GRB the mapping is:
#
#     GREEN -> wire byte 0     RED -> wire byte 1     BLUE -> wire byte 2
#
# i.e. the three parameters come out on the wire in the order
# GREEN, RED, BLUE, and RBARF_SET feeds them frame[3n], frame[3n+1],
# frame[3n+2].  GRB is also what ../../KLIPPER.md has always specified
# and what the 8 base-color LEDs need anyway (the application payload
# is itself GRB), so a base color "rrggbb" reaches the device with its
# channels intact.
#
# The section name decides the LED name.  If you call it something
# else, pass LED_NAME=<name> to RBARF_SET / RBARF_OFF.
#
#[neopixel rbarf]
#pin: PA8
#chain_count: 20
#color_order: GRB
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.0


# ----------------------------------------------------------------------
# SET_LED_INTEGER - exact 0..255 byte interface to SET_LED
# ----------------------------------------------------------------------
# Convention inherited from ../../KLIPPER.md.  The flag bytes (mode,
# duration, mask, features, gamma) and now the framing and CRC bytes
# must reach the device EXACTLY, and hand-written v/255.0 floats are
# easy to mis-round.  The single division here round-trips perfectly:
# Klipper transmits int(value / 255.0 * 255 + 0.5) == value.
#
# SYNC is passed through (default 0 = apply immediately instead of
# queueing behind print moves).  Klipper builds without SET_LED SYNC
# support simply ignore the parameter.
#
# NOTE: if you already have a SET_LED_INTEGER from ../../KLIPPER.md in
# printer.cfg, delete one of the two copies - Klipper refuses to start
# with a duplicate macro name.
# ----------------------------------------------------------------------
[gcode_macro SET_LED_INTEGER]
gcode:
    {% set r = (params.RED|default(0)|int) / 255.0 %}
    {% set g = (params.GREEN|default(0)|int) / 255.0 %}
    {% set b = (params.BLUE|default(0)|int) / 255.0 %}
    {% if params.INDEX is defined %}
    SET_LED LED={params.LED} INDEX={params.INDEX|int} RED={r} GREEN={g} BLUE={b} TRANSMIT={params.TRANSMIT|default(0)|int} SYNC={params.SYNC|default(0)|int}
    {% else %}
    SET_LED LED={params.LED} RED={r} GREEN={g} BLUE={b} TRANSMIT={params.TRANSMIT|default(0)|int} SYNC={params.SYNC|default(0)|int}
    {% endif %}


# ----------------------------------------------------------------------
# RBARF_SET - the one user-facing command
# ----------------------------------------------------------------------
# MODE=STATIC|BLINK|FADE|SEQUENCE|SPIN|SPIN_REV|RAIN|RAIN_REV|DRAW|DRAW_REV
# COLOR=rrggbb                 all 8 LEDs (or the fill before COLORS)
# COLORS=rrggbb,rrggbb,...     up to 8, each entry holds until the next
# DURATION_MS=0..12750         full cycle, snapped to the 50 ms grid
# ALT_COLOR=rrggbb             BLINK / FADE second colour
# MASK_COLOR=rrggbb            BLINK / FADE colour of masked LEDs
# BG_COLOR=rrggbb              sequence-family background
# MASK=0,3,7                   LED INDEX list (not a bit value)
# MASK_BITS=0..255             raw mask byte, bit 7 = LED 0
# SEQ=0,1,5,7                  MODE=SEQUENCE only, 8 or P = pause step
# FADE=0|2|3                   0 none, 2 = 2-LED fade, 3 = 3-LED fade
# GROUP=1|2|4                  LEDs lit simultaneously
# FEATURES=0..15               raw feature byte, instead of FADE+GROUP
# GAMMA=0|1                    0 off, 1 on
# LED_NAME=rbarf               [neopixel] section name
# SYNC=0|1                     0 = send now, 1 = queue with moves
# DEBUG=0|1                    1 = echo the 60 frame bytes as hex
#
# SPIN..DRAW_REV are expanded HERE into mode-0x03 sequences: the chip
# no longer carries the preset tables (owner decision, see
# ../app/anim.c and ../../docs/ANIMATION_PROTOCOL.md "Animation Modes").
# ----------------------------------------------------------------------
[gcode_macro RBARF_SET]
gcode:
    {% set HEXD = '0123456789abcdef' %}
    {% set MODE_NAMES = ['STATIC','BLINK','FADE','SEQUENCE','SPIN','SPIN_REV','RAIN','RAIN_REV','DRAW','DRAW_REV'] %}
    {% set PRESET_NAMES = ['SPIN','SPIN_REV','RAIN','RAIN_REV','DRAW','DRAW_REV'] %}
    {% set PRESET_STEPS = [[0,1,5,7,6,2],[2,6,7,5,1,0],[3,4,0,1,5,7,6,2],[2,6,7,5,1,0,4,3],[0,1,2,3,4,5,6,7],[7,6,5,4,3,2,1,0]] %}

    ; ---- 1. mode ----------------------------------------------------
    {% set mode_name = params.MODE|default('STATIC')|string|trim|upper %}
    {% if mode_name not in MODE_NAMES %}
    { action_raise_error("RBARF_SET: MODE=" ~ mode_name ~ " is not a mode. Use STATIC BLINK FADE SEQUENCE SPIN SPIN_REV RAIN RAIN_REV DRAW DRAW_REV") }
    {% endif %}
    {% set is_static = mode_name == 'STATIC' %}
    {% set is_bf = mode_name in ['BLINK','FADE'] %}
    {% set is_preset = mode_name in PRESET_NAMES %}
    {% set is_seq = (not is_static) and (not is_bf) %}
    {% set mode_byte = 0 if is_static else (1 if mode_name == 'BLINK' else (2 if mode_name == 'FADE' else 3)) %}

    ; ---- 2. reject unknown / mode-inappropriate parameters ----------
    {% set KNOWN = ['MODE','COLOR','COLORS','GAMMA','LED_NAME','SYNC','DEBUG','DURATION_MS','ALT_COLOR','MASK_COLOR','BG_COLOR','MASK','MASK_BITS','SEQ','FADE','GROUP','FEATURES'] %}
    {% set allowed = ['MODE','COLOR','COLORS','GAMMA','LED_NAME','SYNC','DEBUG'] %}
    {% if is_bf %}{% for k in ['DURATION_MS','ALT_COLOR','MASK_COLOR','MASK','MASK_BITS'] %}{% do allowed.append(k) %}{% endfor %}{% endif %}
    {% if is_seq %}{% for k in ['DURATION_MS','BG_COLOR','MASK','MASK_BITS','FADE','GROUP','FEATURES'] %}{% do allowed.append(k) %}{% endfor %}{% endif %}
    {% if mode_name == 'SEQUENCE' %}{% do allowed.append('SEQ') %}{% endif %}
    {% set HINT_FOR = ['DURATION_MS','ALT_COLOR','MASK_COLOR','BG_COLOR','MASK','MASK_BITS','SEQ','FADE','GROUP','FEATURES'] %}
    {% set ANIM = 'BLINK FADE SEQUENCE SPIN SPIN_REV RAIN RAIN_REV DRAW DRAW_REV' %}
    {% set SEQF = 'SEQUENCE SPIN SPIN_REV RAIN RAIN_REV DRAW DRAW_REV' %}
    {% set HINT_TXT = [ANIM,'BLINK FADE','BLINK FADE',SEQF,ANIM,ANIM,'SEQUENCE',SEQF,SEQF,SEQF] %}
    {% for k in params %}
    {% if k not in KNOWN %}
    { action_raise_error("RBARF_SET: unknown parameter " ~ k ~ ". Valid parameters are MODE COLOR COLORS DURATION_MS ALT_COLOR MASK_COLOR BG_COLOR MASK MASK_BITS SEQ FADE GROUP FEATURES GAMMA LED_NAME SYNC DEBUG") }
    {% elif k not in allowed %}
    { action_raise_error("RBARF_SET: " ~ k ~ " is not used by MODE=" ~ mode_name ~ ". It applies to MODE= " ~ HINT_TXT[HINT_FOR.index(k)]) }
    {% endif %}
    {% endfor %}

    ; ---- 3. colours -------------------------------------------------
    ; every rrggbb input is collected first, then validated in one pass
    {% set cnames = [] %}
    {% set ctexts = [] %}
    {% do cnames.append('COLOR') %}
    {% do ctexts.append(params.COLOR|default('')|string) %}
    {% set colors_raw = params.COLORS|default('')|string|trim %}
    {% set colors_list = colors_raw.split(',') if colors_raw != '' else [] %}
    {% if colors_list|length > 8 %}
    { action_raise_error("RBARF_SET: COLORS has " ~ colors_list|length ~ " entries but the device has 8 LEDs") }
    {% endif %}
    {% for e in colors_list %}
    {% do cnames.append('COLORS entry ' ~ loop.index) %}
    {% do ctexts.append(e) %}
    {% endfor %}
    {% do cnames.append('ALT_COLOR') %}
    {% do ctexts.append(params.ALT_COLOR|default('')|string) %}
    {% do cnames.append('MASK_COLOR') %}
    {% do ctexts.append(params.MASK_COLOR|default('')|string) %}
    {% do cnames.append('BG_COLOR') %}
    {% do ctexts.append(params.BG_COLOR|default('')|string) %}
    {% set ctrip = [] %}
    {% for i in range(ctexts|length) %}
    {% set t = ctexts[i]|string|trim|lower %}
    {% if t == '' %}
    {% do ctrip.append(none) %}
    {% else %}
    {% if t|length != 6 %}
    { action_raise_error("RBARF_SET: " ~ cnames[i] ~ "=" ~ ctexts[i] ~ " must be exactly 6 hex digits, like ff8800") }
    {% endif %}
    {% for c in t %}
    {% if c not in HEXD %}
    { action_raise_error("RBARF_SET: " ~ cnames[i] ~ "=" ~ ctexts[i] ~ " contains a non-hex character: " ~ c) }
    {% endif %}
    {% endfor %}
    {% do ctrip.append([HEXD.index(t[0]) * 16 + HEXD.index(t[1]), HEXD.index(t[2]) * 16 + HEXD.index(t[3]), HEXD.index(t[4]) * 16 + HEXD.index(t[5])]) %}
    {% endif %}
    {% endfor %}
    {% set nc = colors_list|length %}
    {% set alt = ctrip[1 + nc] if ctrip[1 + nc] != none else [0,0,0] %}
    {% set mkc = ctrip[2 + nc] if ctrip[2 + nc] != none else [0,0,0] %}
    {% set bgc = ctrip[3 + nc] if ctrip[3 + nc] != none else [0,0,0] %}
    ; carry-forward fill: COLOR is the starting colour, each COLORS
    ; entry replaces it from that LED on, an empty entry keeps the
    ; previous one, and anything past the last entry keeps it too
    {% set base = [] %}
    {% set nsb = namespace(cur = ctrip[0] if ctrip[0] != none else [0,0,0]) %}
    {% for i in range(8) %}
    {% if i < nc and ctrip[1 + i] != none %}{% set nsb.cur = ctrip[1 + i] %}{% endif %}
    {% do base.append(nsb.cur) %}
    {% endfor %}

    ; ---- 4. duration ------------------------------------------------
    {% set dur_raw = params.DURATION_MS|default('0' if is_static else '1000')|string|trim %}
    {% if dur_raw == '' or not dur_raw.isdigit() %}
    { action_raise_error("RBARF_SET: DURATION_MS=" ~ dur_raw ~ " must be a whole number of milliseconds between 0 and 12750") }
    {% endif %}
    {% set dur_ms = dur_raw|int %}
    {% if dur_ms > 12750 %}
    { action_raise_error("RBARF_SET: DURATION_MS=" ~ dur_ms ~ " is out of range. The wire field is one byte of 50 ms units, so 0 to 12750 ms") }
    {% endif %}
    {% set dur_units = (dur_ms + 25) // 50 %}
    {% if dur_ms > 0 and dur_units == 0 %}
    { action_raise_error("RBARF_SET: DURATION_MS=" ~ dur_ms ~ " rounds to zero on the 50 ms wire grid, which the device reads as static. Use 0 for static, or 25 ms and up") }
    {% endif %}

    ; ---- 5. LED mask ------------------------------------------------
    {% set mask_given = params.MASK is defined %}
    {% set bits_given = params.MASK_BITS is defined %}
    {% if mask_given and bits_given %}
    { action_raise_error("RBARF_SET: give MASK or MASK_BITS, not both") }
    {% endif %}
    {% set nsm = namespace(byte=0) %}
    {% if bits_given %}
    {% set mb_raw = params.MASK_BITS|string|trim %}
    {% if mb_raw == '' or not mb_raw.isdigit() or (mb_raw|int) > 255 %}
    { action_raise_error("RBARF_SET: MASK_BITS=" ~ mb_raw ~ " must be 0 to 255. Bit 7 is LED 0 and bit 0 is LED 7") }
    {% endif %}
    {% set nsm.byte = mb_raw|int %}
    {% elif mask_given %}
    {% set mask_raw = params.MASK|string|trim %}
    {% set midx = [] %}
    {% for tok in (mask_raw.split(',') if mask_raw != '' else []) %}
    {% set s = tok|string|trim %}
    {% if s != '' %}
    {% if not s.isdigit() or (s|int) > 7 %}
    { action_raise_error("RBARF_SET: MASK entry " ~ s ~ " is not an LED index. MASK takes LED indexes 0 to 7, like MASK=0,3,7. For a raw byte use MASK_BITS") }
    {% endif %}
    {% do midx.append(s|int) %}
    {% endif %}
    {% endfor %}
    {% for i in range(8) %}
    {% if i in midx %}{% set nsm.byte = nsm.byte + (128 // (2 ** i)) %}{% endif %}
    {% endfor %}
    {% endif %}
    {% set mask_byte = nsm.byte %}

    ; ---- 6. sequence steps and nibble packing -----------------------
    ; preset modes are expanded here, host side: the chip only knows
    ; mode 0x03 and reads these nibbles out of flags[7..22]
    {% set steps = [] %}
    {% if is_preset %}
    {% for s in PRESET_STEPS[PRESET_NAMES.index(mode_name)] %}{% do steps.append(s) %}{% endfor %}
    {% elif mode_name == 'SEQUENCE' %}
    {% set seq_raw = params.SEQ|default('')|string|trim %}
    {% if seq_raw == '' %}
    { action_raise_error("RBARF_SET: MODE=SEQUENCE needs SEQ, for example SEQ=0,1,5,7. Use 8 or P for a pause step") }
    {% endif %}
    {% for tok in seq_raw.split(',') %}
    {% set s = tok|string|trim|upper %}
    {% if s in ['P','PAUSE','-'] %}
    {% do steps.append(8) %}
    {% elif s.isdigit() and (s|int) <= 8 %}
    {% do steps.append(s|int) %}
    {% else %}
    { action_raise_error("RBARF_SET: SEQ step " ~ tok ~ " is not valid. Use 0 to 7 for an LED, or 8 or P for a pause step") }
    {% endif %}
    {% endfor %}
    {% if steps|length > 31 %}
    { action_raise_error("RBARF_SET: SEQ has " ~ steps|length ~ " steps. flags 7 to 22 hold 32 nibbles, so at most 31 steps plus the terminator") }
    {% endif %}
    {% endif %}
    ; nibbles: 0-7 light an LED, 8 is a pause, 9-15 terminate.  The
    ; terminator nibble is 15, and a half-used byte is filled with 15
    ; too, which is exactly how the old on-chip preset tables looked
    ; (spin -> 01 57 62 FF).
    {% set nib = [] %}
    {% for s in steps %}{% do nib.append(s) %}{% endfor %}
    {% if steps|length > 0 %}
    {% do nib.append(15) %}
    {% if (nib|length) % 2 == 1 %}{% do nib.append(15) %}{% endif %}
    {% endif %}
    {% set seqbytes = [] %}
    {% for i in range(0, nib|length, 2) %}{% do seqbytes.append(nib[i] * 16 + nib[i + 1]) %}{% endfor %}

    ; ---- 7. feature bits --------------------------------------------
    {% set nsf = namespace(bits=0) %}
    {% if params.FEATURES is defined %}
    {% if params.FADE is defined or params.GROUP is defined %}
    { action_raise_error("RBARF_SET: FEATURES is the raw feature byte. Use FEATURES alone, or use FADE and GROUP, but not both") }
    {% endif %}
    {% set fx = params.FEATURES|string|trim %}
    {% if fx == '' or not fx.isdigit() or (fx|int) > 15 %}
    { action_raise_error("RBARF_SET: FEATURES=" ~ fx ~ " must be 0 to 15. bit 0 = 3-LED fade, bit 1 = 2-LED fade, bit 2 = 2-LED group, bit 3 = 4-LED group") }
    {% endif %}
    {% set nsf.bits = fx|int %}
    {% else %}
    {% set fade_raw = params.FADE|default('0')|string|trim %}
    {% if fade_raw not in ['0','2','3'] %}
    { action_raise_error("RBARF_SET: FADE=" ~ fade_raw ~ " must be 0 for no fading, 2 for 2-LED fading or 3 for 3-LED fading") }
    {% endif %}
    {% set group_raw = params.GROUP|default('1')|string|trim %}
    {% if group_raw not in ['1','2','4'] %}
    { action_raise_error("RBARF_SET: GROUP=" ~ group_raw ~ " must be 1, 2 or 4 - the number of LEDs lit at the same time") }
    {% endif %}
    {% set nsf.bits = (1 if fade_raw == '3' else (2 if fade_raw == '2' else 0)) + (4 if group_raw == '2' else (8 if group_raw == '4' else 0)) %}
    {% endif %}
    {% set features = nsf.bits %}

    ; ---- 8. gamma ---------------------------------------------------
    {% set gam_raw = params.GAMMA|default('0')|string|trim|upper %}
    {% set gam = 1 if gam_raw == 'ON' else (0 if gam_raw == 'OFF' else ((gam_raw|int) if (gam_raw.isdigit() and (gam_raw|int) <= 4) else 255)) %}
    {% if gam == 255 %}
    { action_raise_error("RBARF_SET: GAMMA=" ~ gam_raw ~ " must be 0 or 1 (also ON or OFF). This firmware build carries one curve, so 2 3 4 are accepted but behave like 1") }
    {% endif %}

    ; ---- 9. target and delivery -------------------------------------
    {% set led_name = params.LED_NAME|default('rbarf')|string|trim %}
    {% if led_name == '' %}
    { action_raise_error("RBARF_SET: LED_NAME must be the name of your neopixel section") }
    {% endif %}
    {% set sync_raw = params.SYNC|default('0')|string|trim %}
    {% if sync_raw not in ['0','1'] %}
    { action_raise_error("RBARF_SET: SYNC=" ~ sync_raw ~ " must be 0 to send the frame now, or 1 to queue it with print moves") }
    {% endif %}
    {% set dbg_raw = params.DEBUG|default('0')|string|trim %}
    {% if dbg_raw not in ['0','1'] %}
    { action_raise_error("RBARF_SET: DEBUG=" ~ dbg_raw ~ " must be 0 or 1") }
    {% endif %}

    ; ---- 10. the 48 DATA bytes --------------------------------------
    ; bytes 0..23  = 8 base colours, GRB per LED
    ; bytes 24..47 = flags[0..23]
    {% set data = [] %}
    {% for i in range(8) %}
    {% do data.append(base[i][1]) %}
    {% do data.append(base[i][0]) %}
    {% do data.append(base[i][2]) %}
    {% endfor %}
    {% set flags = [mode_byte, dur_units, mask_byte] %}
    {% if is_bf %}
    {% do flags.append(alt[1]) %}
    {% do flags.append(alt[0]) %}
    {% do flags.append(alt[2]) %}
    {% do flags.append(mkc[1]) %}
    {% do flags.append(mkc[0]) %}
    {% do flags.append(mkc[2]) %}
    {% for i in range(14) %}{% do flags.append(0) %}{% endfor %}
    {% elif is_seq %}
    {% do flags.append(bgc[1]) %}
    {% do flags.append(bgc[0]) %}
    {% do flags.append(bgc[2]) %}
    {% do flags.append(features) %}
    {% for i in range(16) %}{% do flags.append(seqbytes[i] if i < seqbytes|length else 0) %}{% endfor %}
    {% else %}
    {% for i in range(20) %}{% do flags.append(0) %}{% endfor %}
    {% endif %}
    {% do flags.append(gam) %}
    {% if (flags|length) != 24 %}
    { action_raise_error("RBARF_SET: internal error, flag block is " ~ flags|length ~ " bytes instead of 24") }
    {% endif %}
    {% for f in flags %}{% do data.append(f) %}{% endfor %}
    {% if (data|length) != 48 %}
    { action_raise_error("RBARF_SET: internal error, DATA is " ~ data|length ~ " bytes instead of 48") }
    {% endif %}

    ; ---- 11. CRC-16/CCITT-FALSE over the 48 DATA bytes --------------
    ; bit-serial shift register, MSB first, 16 bits wide, init 65535
    ; (= 0xFFFF), no reflection, no xorout.  fb is the single-bit XOR
    ; of the register top bit and the incoming data bit; the polynomial
    ; fold "x ^ 0x1021" is written as arithmetic because bit 0 of x is
    ; always clear right after the shift, leaving only bits 12 and 5 to
    ; correct.  See the header comment for the identity.
    {% set POW2 = [128,64,32,16,8,4,2,1] %}
    {% set nsc = namespace(crc=65535) %}
    {% for b in data %}
    {% for p in POW2 %}
    {% set fb = ((nsc.crc // 32768) + ((b // p) % 2)) % 2 %}
    {% set sh = (nsc.crc * 2) % 65536 %}
    {% set nsc.crc = (sh + 4129 - 8192 * ((sh // 4096) % 2) - 64 * ((sh // 32) % 2)) if fb == 1 else sh %}
    {% endfor %}
    {% endfor %}
    {% set crc_hi = nsc.crc // 256 %}
    {% set crc_lo = nsc.crc % 256 %}

    ; ---- 12. the frame ----------------------------------------------
    ; HEADER 255 170 101 = FF AA 65   (sync, bit-period ruler, alignment)
    ; TRAILER 154 0 255  = 9A 00 FF   (alignment, ZEROS probe, sync)
    ; the CRC16 written three times, HI then LO in every copy (v2.3):
    ; 3 + 48 + 6 + 3 = 60 bytes = 20 whole LEDs, no pad byte
    {% set frame = [255, 170, 101] %}
    {% for b in data %}{% do frame.append(b) %}{% endfor %}
    {% do frame.append(crc_hi) %}
    {% do frame.append(crc_lo) %}
    {% do frame.append(crc_hi) %}
    {% do frame.append(crc_lo) %}
    {% do frame.append(crc_hi) %}
    {% do frame.append(crc_lo) %}
    {% for b in [154, 0, 255] %}{% do frame.append(b) %}{% endfor %}
    {% if (frame|length) != 60 %}
    { action_raise_error("RBARF_SET: internal error, frame is " ~ frame|length ~ " bytes instead of 60") }
    {% endif %}

    ; ---- 13. optional echo ------------------------------------------
    {% if dbg_raw == '1' %}
    {% set hx = [] %}
    {% for b in frame %}{% do hx.append('%02X'|format(b)) %}{% endfor %}
    { action_respond_info("RBARF v2.3 frame, 60 bytes (20 LEDs exactly): " ~ hx|join('')) }
    {% endif %}

    ; ---- 14. push the 60 bytes out as 20 LEDs -----------------------
    ; GRB order: GREEN is wire byte 0 of the LED, RED byte 1, BLUE
    ; byte 2.  Only the last LED carries TRANSMIT=1, so the whole
    ; frame leaves in one WS2812 burst.
    {% for i in range(20) %}
    SET_LED_INTEGER LED={led_name} INDEX={i + 1} GREEN={frame[i * 3]} RED={frame[i * 3 + 1]} BLUE={frame[i * 3 + 2]} TRANSMIT={1 if i == 19 else 0} SYNC={sync_raw}
    {% endfor %}


# ----------------------------------------------------------------------
# RBARF_OFF - all 8 LEDs black, no animation
# ----------------------------------------------------------------------
# A full v2.3 frame like any other, so the device replaces its state
# instead of holding the previous animation.
# ----------------------------------------------------------------------
[gcode_macro RBARF_OFF]
gcode:
    {% set led_name = params.LED_NAME|default('rbarf')|string|trim %}
    RBARF_SET MODE=STATIC COLOR=000000 LED_NAME={led_name}
