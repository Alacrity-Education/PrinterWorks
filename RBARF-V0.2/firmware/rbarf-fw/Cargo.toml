[package]
name = "rbarf-fw"
version = "0.2.0"
edition = "2024"
description = "RBARF v0.2 firmware (STM32C011D6, Embassy): display path + WS2812 receiver"
publish = false

[[bin]]
name = "rbarf-fw"
test = false
bench = false

[features]
default = ["out-pwm", "time-tim14"]
# LED output backend — exactly one. See src/ws2812_out/.
out-pwm = []  # timer PWM + DMA, OutputPolarity::ActiveLow (priority path)
out-spi = []  # SPI1 MOSI (PA2), 4 SPI bits per WS2812 bit, bytes inverted

# embassy-time driver — exactly one.
# time-tim14 (default, resource split B): this crate's driver on 1-channel
#   TIM14 (src/time_driver.rs). Frees TIM3 for the WS2812 receiver
#   (src/ws2812_in/), which is only built with this feature.
# time-tim3: embassy-stm32's own driver on TIM3 (the only choices it offers on
#   this chip are TIM1/TIM3; TIM1 drives the LEDs). No receiver: the demo
#   playlist runs forever.
time-tim3 = ["embassy-stm32/time-driver-tim3"]
time-tim14 = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]

# Bench diagnostics, off by default.
# time-selftest: at boot, measure Timer::after / Timer::at against Instant
#   (incl. a 65.536 ms TIM14 period boundary and an alarm in the past).
time-selftest = []
# rx-hist: keep a 64-bin width histogram of every accepted-length frame and
#   log it every 10 s (bench check B2). +256 B RAM.
rx-hist = []

[dependencies]
rbarf-anim = { path = "../rbarf-anim" }
rbarf-proto = { path = "../rbarf-proto", features = ["defmt"] }

embassy-stm32 = { version = "0.6.0", features = ["stm32c011d6", "defmt", "unstable-pac", "rt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-time-driver = { version = "0.2.2", optional = true }
embassy-time-queue-utils = { version = "0.3.2", optional = true }
embassy-sync = { version = "0.8.0", features = ["defmt"] }

# encoding-raw: defmt-rtt holds a critical section for the whole log frame;
# rzcobs costs ~3x more per frame (46 vs 14 us empty, measured). See README.
defmt = { version = "1.1.1", features = ["encoding-raw"] }
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"
embedded-hal = "1.0.0"
